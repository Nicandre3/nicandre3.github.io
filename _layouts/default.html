<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title and page.type != 'note' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title><meta name="description" content="{{ page.summary | default: site.description | strip_html | normalize_whitespace | escape }}"><link rel="canonical" href="{{ page.url | absolute_url }}"><script>try{let t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head><body><a class="skip" href="#main">跳到正文</a><div class="app"><header class="top"><a class="home-link" href="{{ '/' | relative_url }}" aria-label="返回首页"><span class="logo">z.</span><span>动态</span></a><div class="top-actions"><a href="{{ '/categories/' | relative_url }}">分类</a><a href="{{ '/archive/' | relative_url }}">归档</a><a href="{{ '/about/' | relative_url }}">关于</a><button id="theme" aria-label="切换深色或浅色模式" type="button">◐</button></div></header><main id="main">{{ content }}</main><footer><span>一个人的小小角落</span><a href="https://github.com/zhc425">GitHub ↗</a></footer></div><script src="{{ '/assets/site.js' | relative_url }}" defer></script></body></html>
