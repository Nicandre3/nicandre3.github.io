<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title><meta name="description" content="{{ page.summary | default: site.description | strip_html | normalize_whitespace | escape }}"><link rel="canonical" href="{{ page.url | absolute_url }}"><script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head><body><a class="skip" href="#main">跳至正文</a><div class="shell"><header class="top"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">留</span><span>留白之间<small>NOTES, SLOWLY</small></span></a><nav aria-label="主导航"><a href="{{ '/' | relative_url }}">首页</a><a href="{{ '/archive/' | relative_url }}">归档</a><a href="{{ '/categories/' | relative_url }}">分类</a><a href="{{ '/about/' | relative_url }}">关于</a></nav><button id="theme" type="button" aria-label="切换主题">◐ <span>主题</span></button></header><main id="main">{{ content }}</main><footer><span>留白之间 <i>·</i> 一页一页，慢慢写。</span><a href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false">回到开头 ↑</a></footer></div><script>const b=document.getElementById('theme');b.addEventListener('click',()=>{let d=document.documentElement;let current=d.dataset.theme|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=current==='dark'?'light':'dark';try{localStorage.setItem('theme',d.dataset.theme)}catch(e){}})</script></body></html>
